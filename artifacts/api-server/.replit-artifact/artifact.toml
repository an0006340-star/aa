kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/health"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["uv", "run", "--project", ".", "python", "-m", "compileall", "artifacts/api-server/main.py"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["uv", "run", "--project", ".", "uvicorn", "--app-dir", "artifacts/api-server", "main:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/health"